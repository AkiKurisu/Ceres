<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc"><title id="title">Ceres configuration provider priority</title><desc id="desc">Editor resolution checks base, platform, then persistent providers. Player resolution checks streaming then persistent providers.</desc><defs><style>.bg{fill:#141515}.card{fill:#202020;stroke:#3a3d3c;stroke-width:2}.hot{fill:#183b37;stroke:#52d6c8;stroke-width:2}.t{fill:#eeeeec;font:700 20px Sora,Segoe UI,sans-serif}.l{fill:#a0a4a1;font:14px Segoe UI,sans-serif}.n{fill:#52d6c8;font:700 13px Sora,Segoe UI,sans-serif;letter-spacing:1px}.arrow{stroke:#52d6c8;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3 0 6Z" fill="#52d6c8"/></marker></defs><rect class="bg" width="1100" height="500" rx="24"/><text class="n" x="70" y="62">PROVIDERS ARE CHECKED FROM HIGH TO LOW PRIORITY</text><text class="t" x="70" y="130">Editor</text><g transform="translate(210 92)"><rect class="hot" width="210" height="105" rx="12"/><text class="n" x="20" y="32">PRIORITY 300</text><text class="t" x="20" y="68">Base</text></g><path class="arrow" d="M440 145H500"/><g transform="translate(520 92)"><rect class="card" width="210" height="105" rx="12"/><text class="n" x="20" y="32">PRIORITY 200</text><text class="t" x="20" y="68">Platform</text></g><path class="arrow" d="M750 145H810"/><g transform="translate(830 92)"><rect class="card" width="210" height="105" rx="12"/><text class="n" x="20" y="32">PRIORITY 100</text><text class="t" x="20" y="68">Persistent</text></g><text class="t" x="70" y="335">Player</text><g transform="translate(365 275)"><rect class="hot" width="210" height="105" rx="12"/><text class="n" x="20" y="32">PRIORITY 200</text><text class="t" x="20" y="68">Streaming</text></g><path class="arrow" d="M595 328H655"/><g transform="translate(675 275)"><rect class="card" width="210" height="105" rx="12"/><text class="n" x="20" y="32">PRIORITY 100</text><text class="t" x="20" y="68">Persistent</text></g><text class="l" x="365" y="425">The first provider containing the requested config supplies it.</text></svg>
