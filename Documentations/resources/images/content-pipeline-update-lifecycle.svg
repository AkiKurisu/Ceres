<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Baseline and update lifecycle</title><desc id="desc">A baseline freezes identity and policy before a scoped update is validated and packaged.</desc>
  <defs><style>.bg{fill:#141515}.card{fill:#202020;stroke:#3a3d3c;stroke-width:2}.active{fill:#183b37;stroke:#52d6c8;stroke-width:2}.title{fill:#eeeeec;font:700 23px Sora,Segoe UI,sans-serif}.label{fill:#52d6c8;font:700 14px Sora,Segoe UI,sans-serif;letter-spacing:1px}.body{fill:#a0a4a1;font:15px Segoe UI,sans-serif}.arrow{stroke:#52d6c8;stroke-width:4;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3 0 6Z" fill="#52d6c8"/></marker></defs>
  <rect class="bg" width="1200" height="520" rx="24"/><text class="label" x="70" y="72">CONTENT UPDATE CONTRACT</text>
  <g transform="translate(70 145)"><rect class="card" width="230" height="210" rx="14"/><text class="title" x="24" y="52">Build graph</text><text class="body" x="24" y="94">Resolve scopes</text><text class="body" x="24" y="126">Plan ownership</text><text class="body" x="24" y="158">Validate inputs</text></g><path class="arrow" d="M320 250H400"/>
  <g transform="translate(420 145)"><rect class="active" width="230" height="210" rx="14"/><text class="title" x="24" y="52">Baseline</text><text class="body" x="24" y="94">Freeze identities</text><text class="body" x="24" y="126">Record fingerprints</text><text class="body" x="24" y="158">Preserve contract</text></g><path class="arrow" d="M670 250H750"/>
  <g transform="translate(770 145)"><rect class="card" width="160" height="210" rx="14"/><text class="title" x="24" y="52">Update</text><text class="body" x="24" y="94">Select scopes</text><text class="body" x="24" y="126">Compare</text><text class="body" x="24" y="158">Reject drift</text></g><path class="arrow" d="M950 250H1015"/>
  <g transform="translate(1035 145)"><rect class="card" width="105" height="210" rx="14"/><text class="title" x="16" y="52">Ship</text><text class="body" x="16" y="94">Catalog</text><text class="body" x="16" y="126">Bundles</text><text class="body" x="16" y="158">Manifest</text></g>
</svg>
