<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc"><title id="title">Ceres level loading flow</title><desc id="desc">Authored level rows resolve to Addressable scenes, loading progress and lifecycle events, then enter single or additive runtime roles.</desc><defs><style>.bg{fill:#141515}.card{fill:#202020;stroke:#3a3d3c;stroke-width:2}.hot{fill:#183b37;stroke:#52d6c8;stroke-width:2}.t{fill:#eeeeec;font:700 22px Sora,Segoe UI,sans-serif}.n{fill:#52d6c8;font:700 13px Sora,Segoe UI,sans-serif;letter-spacing:1px}.b{fill:#a0a4a1;font:15px Segoe UI,sans-serif}.arrow{stroke:#52d6c8;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3 0 6Z" fill="#52d6c8"/></marker></defs><rect class="bg" width="1200" height="540" rx="24"/><text class="n" x="70" y="65">AUTHORED LEVEL TO RUNTIME ROLE</text><g transform="translate(60 145)"><rect class="card" width="230" height="220" rx="14"/><text class="t" x="24" y="53">LevelSceneRow</text><text class="b" x="24" y="95">Addressable scene</text><text class="b" x="24" y="127">Name and tags</text><text class="b" x="24" y="159">Platform policy</text></g><path class="arrow" d="M310 255H380"/><g transform="translate(400 145)"><rect class="card" width="220" height="220" rx="14"/><text class="t" x="24" y="53">LevelReference</text><text class="b" x="24" y="95">Resolve by name</text><text class="b" x="24" y="127">Resolve by tag</text><text class="b" x="24" y="159">Select load policy</text></g><path class="arrow" d="M640 255H710"/><g transform="translate(730 115)"><rect class="hot" width="240" height="280" rx="14"/><text class="n" x="24" y="38">LEVEL SYSTEM</text><text class="t" x="24" y="79">Addressables load</text><text class="b" x="24" y="122">Pre-load event</text><text class="b" x="24" y="154">Reactive progress</text><text class="b" x="24" y="186">Scene activation</text><text class="b" x="24" y="218">Post-load event</text></g><path class="arrow" d="M990 200H1015"/><path class="arrow" d="M990 320H1015"/><g transform="translate(1025 135)"><rect class="card" width="150" height="105" rx="12"/><text class="t" x="18" y="45">Single</text><text class="b" x="18" y="73">Replace</text></g><g transform="translate(1025 285)"><rect class="card" width="150" height="105" rx="12"/><text class="t" x="18" y="45">Additive</text><text class="b" x="18" y="73">Stack role</text></g></svg>
