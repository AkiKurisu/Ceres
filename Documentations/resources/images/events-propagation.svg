<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">Ceres event propagation</title><desc id="desc">An event travels from the root to its target during trickle-down, then returns during bubble-up.</desc><defs><style>.bg{fill:#141515}.node{fill:#202020;stroke:#3a3d3c;stroke-width:2}.target{fill:#183b37;stroke:#52d6c8;stroke-width:2}.t{fill:#eeeeec;font:700 21px Sora,Segoe UI,sans-serif}.l{fill:#a0a4a1;font:15px Segoe UI,sans-serif}.down{stroke:#52d6c8;stroke-width:4;fill:none;marker-end:url(#a)}.up{stroke:#0b8f83;stroke-width:4;fill:none;marker-end:url(#b)}</style><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3 0 6Z" fill="#52d6c8"/></marker><marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3 0 6Z" fill="#0b8f83"/></marker></defs><rect class="bg" width="1000" height="430" rx="24"/><text class="l" x="80" y="65">TRICKLE-DOWN</text><text class="l" x="790" y="65">BUBBLE-UP</text><g transform="translate(395 55)"><rect class="node" width="210" height="70" rx="12"/><text class="t" x="73" y="43">Root</text><rect class="node" y="135" width="210" height="70" rx="12"/><text class="t" x="62" y="178">Parent</text><rect class="target" y="270" width="210" height="70" rx="12"/><text class="t" x="63" y="313">Target</text></g><path class="down" d="M375 90H250V360H375M375 225H250"/><path class="up" d="M625 395H750V90H625M625 225H750"/></svg>
