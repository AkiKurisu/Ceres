<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc"><title id="title">Ceres PlayableGraph animation runtime</title><desc id="desc">Clips, Animator Controllers, and sequences feed montage-style layers, masks, blending and notifications before reaching the Animator output.</desc><defs><style>.bg{fill:#141515}.card{fill:#202020;stroke:#3a3d3c;stroke-width:2}.hot{fill:#183b37;stroke:#52d6c8;stroke-width:2}.t{fill:#eeeeec;font:700 23px Sora,Segoe UI,sans-serif}.n{fill:#52d6c8;font:700 13px Sora,Segoe UI,sans-serif;letter-spacing:1px}.b{fill:#a0a4a1;font:15px Segoe UI,sans-serif}.arrow{stroke:#52d6c8;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3 0 6Z" fill="#52d6c8"/></marker></defs><rect class="bg" width="1200" height="610" rx="24"/><text class="n" x="70" y="65">SCRIPT-DRIVEN PLAYABLEGRAPH</text><g transform="translate(70 120)"><rect class="card" width="250" height="105" rx="12"/><text class="t" x="24" y="45">Animation clips</text><text class="b" x="24" y="75">Cross-fade playback</text><rect class="card" y="135" width="250" height="105" rx="12"/><text class="t" x="24" y="180">Controllers</text><text class="b" x="24" y="210">Animator Controller input</text><rect class="card" y="270" width="250" height="105" rx="12"/><text class="t" x="24" y="315">Sequences</text><text class="b" x="24" y="345">Composed clip timing</text></g><path class="arrow" d="M340 172H425M340 307H425M340 442H425"/><g transform="translate(445 150)"><rect class="hot" width="310" height="330" rx="14"/><text class="n" x="28" y="42">ANIMATION PROXY</text><text class="t" x="28" y="84">Layer mixer</text><text class="b" x="28" y="130">Montage-style cross-fades</text><text class="b" x="28" y="166">Layer weight and additive mode</text><text class="b" x="28" y="202">Avatar masks</text><text class="b" x="28" y="238">Completion and time notifiers</text><path d="M28 266H282" stroke="#3a3d3c"/><text class="n" x="28" y="303">CONTROL FROM C# OR FLOW</text></g><path class="arrow" d="M775 315H860"/><g transform="translate(880 225)"><rect class="card" width="250" height="180" rx="14"/><text class="t" x="28" y="58">Animator output</text><text class="b" x="28" y="100">PlayableGraph owns</text><text class="b" x="28" y="132">the runtime connection</text></g></svg>
