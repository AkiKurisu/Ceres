<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Ceres mod authoring and runtime lifecycle</title><desc id="desc">A mod export configuration produces a catalog, bundles, and configuration that are discovered, validated, and mounted at runtime.</desc><defs><style>.bg{fill:#141515}.card{fill:#202020;stroke:#3a3d3c;stroke-width:2}.hot{fill:#183b37;stroke:#52d6c8;stroke-width:2}.t{fill:#eeeeec;font:700 22px Sora,Segoe UI,sans-serif}.n{fill:#52d6c8;font:700 13px Sora,Segoe UI,sans-serif;letter-spacing:1px}.b{fill:#a0a4a1;font:15px Segoe UI,sans-serif}.arrow{stroke:#52d6c8;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3 0 6Z" fill="#52d6c8"/></marker></defs><rect class="bg" width="1200" height="560" rx="24"/><text class="n" x="70" y="65">MOD AUTHORING AND RUNTIME LOADING</text><g transform="translate(45 145)"><rect class="card" width="270" height="220" rx="14"/><text class="t" x="22" y="52">ModExportConfig</text><text class="b" x="22" y="94">Metadata and API version</text><text class="b" x="22" y="126">Addressables group</text><text class="b" x="22" y="158">Export selection</text></g><path class="arrow" d="M335 255H365"/><g transform="translate(385 145)"><rect class="card" width="220" height="220" rx="14"/><text class="t" x="22" y="52">Exporter</text><text class="b" x="22" y="94">Catalog</text><text class="b" x="22" y="126">Bundles</text><text class="b" x="22" y="158">ModConfig.cfg</text></g><path class="arrow" d="M625 255H675"/><g transform="translate(695 115)"><rect class="hot" width="270" height="280" rx="14"/><text class="n" x="24" y="40">MOD LOADER</text><text class="t" x="24" y="80">Discover &amp; validate</text><text class="b" x="24" y="124">Extract downloads</text><text class="b" x="24" y="156">Check API version</text><text class="b" x="24" y="188">Apply enabled state</text><text class="b" x="24" y="220">Load additional catalog</text></g><path class="arrow" d="M985 255H1020"/><g transform="translate(1040 145)"><rect class="card" width="130" height="220" rx="14"/><text class="t" x="18" y="52">Runtime</text><text class="b" x="18" y="94">Resource</text><text class="b" x="18" y="126">System</text><text class="b" x="18" y="175">Mounted</text></g></svg>
