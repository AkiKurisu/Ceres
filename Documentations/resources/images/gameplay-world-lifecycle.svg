<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Ceres gameplay world lifecycle</title><desc id="desc">GameWorld owns actor registration, stable handles, lifecycle-managed subsystems, and the actor query snapshot.</desc><defs><style>.bg{fill:#141515}.card{fill:#202020;stroke:#3a3d3c;stroke-width:2}.hot{fill:#183b37;stroke:#52d6c8;stroke-width:2}.t{fill:#eeeeec;font:700 24px Sora,Segoe UI,sans-serif}.n{fill:#52d6c8;font:700 13px Sora,Segoe UI,sans-serif;letter-spacing:1px}.b{fill:#a0a4a1;font:15px Segoe UI,sans-serif}.line{stroke:#52d6c8;stroke-width:3;fill:none;marker-end:url(#m)}.muted{stroke:#5d6260;stroke-width:2;stroke-dasharray:7 7;fill:none;marker-end:url(#g)}</style><marker id="m" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3 0 6Z" fill="#52d6c8"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3 0 6Z" fill="#5d6260"/></marker></defs><rect class="bg" width="1200" height="600" rx="24"/><text class="n" x="70" y="65">WORLD-LIFETIME GAMEPLAY SCAFFOLD</text><g transform="translate(455 85)"><rect class="hot" width="290" height="100" rx="14"/><text class="t" x="79" y="43">GameWorld</text><text class="b" x="61" y="73">Single world context</text></g><path class="line" d="M520 190V245H255V285"/><path class="line" d="M600 190V285"/><path class="line" d="M680 190V245H945V285"/><g transform="translate(90 285)"><rect class="card" width="330" height="210" rx="14"/><text class="n" x="25" y="38">ACTOR REGISTRY</text><text class="t" x="25" y="78">Actors and Components</text><text class="b" x="25" y="117">Register on Awake</text><text class="b" x="25" y="147">Stable ActorHandle slots</text><text class="b" x="25" y="177">Unregister on Destroy</text></g><g transform="translate(455 285)"><rect class="card" width="290" height="210" rx="14"/><text class="n" x="25" y="38">MANAGED SERVICES</text><text class="t" x="25" y="78">WorldSubsystems</text><text class="b" x="25" y="117">Automatic discovery</text><text class="b" x="25" y="147">World-bound lifetime</text><text class="b" x="25" y="177">Container and queries</text></g><g transform="translate(780 285)"><rect class="card" width="330" height="210" rx="14"/><text class="n" x="25" y="38">QUERY VIEW</text><text class="t" x="25" y="78">Actor snapshot</text><text class="b" x="25" y="117">NativeArray read model</text><text class="b" x="25" y="147">Rebuilt after registry changes</text><text class="b" x="25" y="177">Consumed by spatial systems</text></g><path class="muted" d="M420 390H455"/><path class="muted" d="M745 390H780"/></svg>
