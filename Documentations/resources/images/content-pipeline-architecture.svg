<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Ceres content pipeline architecture</title>
  <desc id="desc">Project policy is converted into a content graph, deterministic Addressables artifacts, and runtime-mounted packages.</desc>
  <defs><style>.bg{fill:#141515}.card{fill:#202020;stroke:#3a3d3c;stroke-width:2}.soft{fill:#2a2a2a}.title{fill:#eeeeec;font:700 28px Sora,Segoe UI,sans-serif}.label{fill:#52d6c8;font:700 15px Sora,Segoe UI,sans-serif;letter-spacing:1px}.body{fill:#a0a4a1;font:16px Segoe UI,sans-serif}.arrow{stroke:#52d6c8;stroke-width:4;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3 0 6Z" fill="#52d6c8"/></marker></defs>
  <rect class="bg" width="1200" height="560" rx="24"/>
  <text class="label" x="70" y="70">CONTENT FROM POLICY TO RUNTIME</text>
  <g transform="translate(70 115)"><rect class="card" width="280" height="330" rx="14"/><text class="title" x="28" y="55">Project policy</text><rect class="soft" x="28" y="85" width="224" height="52" rx="8"/><text class="body" x="48" y="118">Scopes and ownership</text><rect class="soft" x="28" y="153" width="224" height="52" rx="8"/><text class="body" x="48" y="186">Assets and dependencies</text><rect class="soft" x="28" y="221" width="224" height="52" rx="8"/><text class="body" x="48" y="254">Build and update rules</text></g>
  <path class="arrow" d="M370 280H445"/>
  <g transform="translate(465 115)"><rect class="card" width="270" height="330" rx="14"/><text class="title" x="28" y="55">Content graph</text><text class="body" x="28" y="103">Stable identity</text><text class="body" x="28" y="139">Dependency ownership</text><text class="body" x="28" y="175">Packing locations</text><text class="body" x="28" y="211">Validation diagnostics</text><path d="M28 245H242" stroke="#3a3d3c"/><text class="label" x="28" y="287">DETERMINISTIC PLAN</text></g>
  <path class="arrow" d="M755 280H830"/>
  <g transform="translate(850 115)"><rect class="card" width="280" height="330" rx="14"/><text class="title" x="28" y="55">Artifacts</text><rect class="soft" x="28" y="85" width="224" height="52" rx="8"/><text class="body" x="48" y="118">Addressables build</text><rect class="soft" x="28" y="153" width="224" height="52" rx="8"/><text class="body" x="48" y="186">Validated update</text><rect class="soft" x="28" y="221" width="224" height="52" rx="8"/><text class="body" x="48" y="254">Relocatable package</text><text class="label" x="28" y="307">MOUNT AT RUNTIME</text></g>
</svg>
