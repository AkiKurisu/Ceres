  summary: Loads one additive scene by Addressables address (not from <xref href="Ceres.Gameplay.Level.LevelSceneDataTableManager" data-throw-if-not-resolved="false"></xref>). Does not change <xref href="Ceres.Gameplay.Level.LevelSystem.CurrentLevel" data-throw-if-not-resolved="false"></xref> or fire level load events.
