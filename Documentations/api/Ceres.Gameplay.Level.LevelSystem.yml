- uid: Ceres.Gameplay.Level.LevelSystem.UnloadLastAdditiveAsync(System.Boolean,System.Nullable{Ceres.Gameplay.Level.AdditiveSceneRole})
  commentId: M:Ceres.Gameplay.Level.LevelSystem.UnloadLastAdditiveAsync(System.Boolean,System.Nullable{Ceres.Gameplay.Level.AdditiveSceneRole})
  id: UnloadLastAdditiveAsync(System.Boolean,System.Nullable{Ceres.Gameplay.Level.AdditiveSceneRole})
  parent: Ceres.Gameplay.Level.LevelSystem
  langs:
  - csharp
  - vb
  name: UnloadLastAdditiveAsync(bool, AdditiveSceneRole?)
  nameWithType: LevelSystem.UnloadLastAdditiveAsync(bool, AdditiveSceneRole?)
  fullName: Ceres.Gameplay.Level.LevelSystem.UnloadLastAdditiveAsync(bool, Ceres.Gameplay.Level.AdditiveSceneRole?)
  type: Method
  assemblies:
  - Ceres.Gameplay
  namespace: Ceres.Gameplay.Level
  summary: >-
    Unloads one additive scene. By default removes the stack top (LIFO).

    When <code class="paramref">unloadOnlyRole</code> is set, removes the topmost entry whose role matches (scan from most recent downward).
  example: []
  syntax:
    content: public static UniTask<bool> UnloadLastAdditiveAsync(bool restoreRegisteredBaseBeforeUnload = false, AdditiveSceneRole? unloadOnlyRole = null)
    parameters:
    - id: restoreRegisteredBaseBeforeUnload
      type: System.Boolean
      description: When true, sets <xref href="Ceres.Gameplay.Level.LevelSystem.RegisterBaseScene(UnityEngine.SceneManagement.Scene)" data-throw-if-not-resolved="false"></xref> as active before unloading (if registered). For role-filtered unload, applies when the removed entry is an override role.
    - id: unloadOnlyRole
      type: System.Nullable{Ceres.Gameplay.Level.AdditiveSceneRole}
      description: When null, unloads the top of the stack only. When set, unloads the first matching role from the top.
    return:
      type: Cysharp.Threading.Tasks.UniTask{System.Boolean}
      description: True if a scene was unloaded, false if none matched or the stack is empty.
    content.vb: Public Shared Function UnloadLastAdditiveAsync(restoreRegisteredBaseBeforeUnload As Boolean = False, unloadOnlyRole As AdditiveSceneRole? = Nothing) As UniTask(Of Boolean)
  overload: Ceres.Gameplay.Level.LevelSystem.UnloadLastAdditiveAsync*
  nameWithType.vb: LevelSystem.UnloadLastAdditiveAsync(Boolean, AdditiveSceneRole?)
  fullName.vb: Ceres.Gameplay.Level.LevelSystem.UnloadLastAdditiveAsync(Boolean, Ceres.Gameplay.Level.AdditiveSceneRole?)
  name.vb: UnloadLastAdditiveAsync(Boolean, AdditiveSceneRole?)
