- uid: Ceres.Events.CallbackEventHandler.ExecuteDefaultAction(Ceres.Events.EventBase)
  commentId: M:Ceres.Events.CallbackEventHandler.ExecuteDefaultAction(Ceres.Events.EventBase)
  id: ExecuteDefaultAction(Ceres.Events.EventBase)
  parent: Ceres.Events.CallbackEventHandler
  langs:
  - csharp
  - vb
  name: ExecuteDefaultAction(EventBase)
  nameWithType: CallbackEventHandler.ExecuteDefaultAction(EventBase)
  fullName: Ceres.Events.CallbackEventHandler.ExecuteDefaultAction(Ceres.Events.EventBase)
  type: Method
  assemblies:
  - Ceres
  namespace: Ceres.Events
  summary: >-
    Executes logic after the callbacks registered on the event target have executed,

    unless the event has been marked to prevent its default behaviour.

    <xref href="Ceres.Events.EventBase.PreventDefault" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    This method is designed to be overridden by subclasses. Use it to implement event handling without

    registering callbacks which guarantees precedences of callbacks registered by users of the subclass.

    Unlike <xref href="Ceres.Events.CallbackEventHandler.ExecuteDefaultActionAtTarget(Ceres.Events.EventBase)" data-throw-if-not-resolved="false"></xref>, this method is called after the callbacks registered

    on the element
  example: []
  syntax:
    content: protected virtual void ExecuteDefaultAction(EventBase evt)
    parameters:
    - id: evt
      type: Ceres.Events.EventBase
      description: The event instance.
    content.vb: Protected Overridable Sub ExecuteDefaultAction(evt As EventBase)
  overload: Ceres.Events.CallbackEventHandler.ExecuteDefaultAction*
