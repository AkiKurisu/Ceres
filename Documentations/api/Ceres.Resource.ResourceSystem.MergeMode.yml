  name: ResourceSystem.MergeMode
  nameWithType: ResourceSystem.MergeMode
  fullName: Ceres.Resource.ResourceSystem.MergeMode
  type: Enum
  assemblies:
  - Ceres
  namespace: Ceres.Resource
  summary: >-
    Options for merging the results of requests.

    If keys (A, B) mapped to results ([1,2,4],[3,4,5])...
     - UseFirst (or None) takes the results from the first key
     -- [1,2,4]
     - Union takes results of each key and collects items that matched any key.
     -- [1,2,3,4,5]
     - Intersection takes results of each key, and collects items that matched every key.
     -- [4]
  remarks: Aligned with <xref href="UnityEngine.AddressableAssets.Addressables.MergeMode" data-throw-if-not-resolved="false"></xref>
  example: []
  syntax:
    content: public enum ResourceSystem.MergeMode
    content.vb: Public Enum ResourceSystem.MergeMode
